labels:
  execution: ci

when:
  evaluate: 'CI_PIPELINE_EVENT == "pull_request" || CI_PIPELINE_EVENT == "manual" || (CI_PIPELINE_EVENT == "push" && CI_COMMIT_BRANCH == "main")'

steps:
  - name: test-unit
    image: node:20-alpine
    commands:
      - |
        mkdir -p ci-logs
        LOG="ci-logs/test-unit.txt"
        set +e
        sh -eu -c '
          cd scroller-front-end-poc
          npm ci
          npm run test:allure:unit
        ' >"$LOG" 2>&1
        STATUS=$?
        cat "$LOG"
        if [ $STATUS -eq 0 ]; then
          rm -f "$LOG"
        fi
        exit $STATUS

  - name: test-e2e
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    environment:
      JWT_SECRET_KEY: f74ed097f9240073570d2534bb8e4184
      E2E_LOGIN_USERNAME: jack
      E2E_LOGIN_PASSWORD: jackNgrok2026!
      SCROLLER_CUSTOMER_INTERACTIONS_DB_BASE_URL: http://host.containers.internal:8400
      SCROLLER_CUSTOMER_INTERACTIONS_DB_API_KEY: a9e08181c6f01244edc35813e387102bd9c889d014d10d27d940d62d7aaf827d
      SCROLLER_CUSTOMER_CREDENTIAL_JWT_SECRET:
        from_secret: scroller_customer_credential_jwt_secret
      ENRICHMENT_DB_BASE_URL: http://host.containers.internal:8200
      ENRICHMENT_DB_API_KEY: a9e08181c6f01244edc35813e387102bd9c889d014d10d27d940d62d7aaf827d
    commands:
      - |
        mkdir -p ci-logs
        LOG="ci-logs/test-e2e.txt"
        set +e
        sh -eu -c '
          cd scroller-front-end-poc
          npm ci
          npm run test:e2e:ci
        ' >"$LOG" 2>&1
        STATUS=$?
        cat "$LOG"
        if [ $STATUS -eq 0 ]; then
          rm -f "$LOG"
        fi
        exit $STATUS

  - name: allure-report
    image: docker.io/andgineer/allure:2.36.0
    when:
      status: [success, failure]
    commands:
      - |
        mkdir -p ci-logs
        LOG="ci-logs/allure-report.txt"
        set +e
        sh -eu -c '
          mkdir -p allure-results
          for RESULTS_DIR in scroller-front-end-poc/allure-results-unit scroller-front-end-poc/allure-results-e2e; do
            if [ -d "$RESULTS_DIR" ] && [ "$(ls -A "$RESULTS_DIR" 2>/dev/null)" ]; then
              cp -r "$RESULTS_DIR"/. allure-results/
            fi
          done
          find allure-results -type f -name executor.json | while read -r EXECUTOR_FILE; do
            if [ "$(tr -d "[:space:]" < "$EXECUTOR_FILE")" = "{}" ]; then
              rm -f "$EXECUTOR_FILE"
            fi
          done
          if [ "$(ls -A allure-results 2>/dev/null)" ]; then
            /opt/allure-2.36.0/bin/allure generate allure-results --clean -o allure-report
          else
            echo "No Allure result inputs found; skipping report generation"
          fi
        ' >"$LOG" 2>&1
        STATUS=$?
        cat "$LOG"
        if [ $STATUS -eq 0 ]; then
          rm -f "$LOG"
        fi
        exit $STATUS

  - name: store-report-locally
    image: alpine:latest
    when:
      status: [success, failure]
    commands:
      - |
        REPORT_DIR="/reports/${CI_REPO}/${CI_COMMIT_BRANCH}/${CI_COMMIT_SHA}"
        mkdir -p "$REPORT_DIR"

        if [ -d allure-report ] && [ "$(ls -A allure-report 2>/dev/null)" ]; then
          cp -r allure-report/. "$REPORT_DIR/"
          LATEST_DIR="/reports/${CI_REPO}/${CI_COMMIT_BRANCH}/latest"
          rm -f "$LATEST_DIR"
          ln -sf "${CI_COMMIT_SHA}" "$LATEST_DIR"
          echo "CI report URL: http://localhost:8080/reports/${CI_REPO}/${CI_COMMIT_BRANCH}/${CI_COMMIT_SHA}/index.html"
        fi

        if [ -d ci-logs ] && [ "$(ls -A ci-logs 2>/dev/null)" ]; then
          mkdir -p "$REPORT_DIR/ci-logs"
          cp -r ci-logs/. "$REPORT_DIR/ci-logs/"
        fi
