# Kubernetes manifest for Scroller Front-End PoC
#
# Deploy with: make podman-deploy
#
# Do NOT run `podman play kube` against this file directly. It is a template:
# SCROLLER_CUSTOMER_CREDENTIAL_JWT_SECRET below holds a double-underscore
# placeholder token, which the make target substitutes into a temporary rendered
# copy. Deploying the raw file starts the app with that 43-character placeholder
# as its JWT signing secret, so the credentials it mints are rejected by
# scroller-customer-interactions-db and every stack-rank request fails — the
# front end surfaces only a generic 502.

apiVersion: v1
kind: Pod
metadata:
  name: pod_scroller_front_end
  labels:
    app: pod_scroller_front_end
spec:
  restartPolicy: Always
  containers:
    - name: scroller-front-end
      image: host.containers.internal:5000/scroller-front-end-poc:latest
      imagePullPolicy: Always
      env:
        - name: JWT_SECRET_KEY
          value: f74ed097f9240073570d2534bb8e4184
        - name: SCROLLER_CUSTOMER_INTERACTIONS_DB_BASE_URL
          value: http://host.containers.internal:8400
        - name: SCROLLER_CUSTOMER_INTERACTIONS_DB_API_KEY
          value: a9e08181c6f01244edc35813e387102bd9c889d014d10d27d940d62d7aaf827d
        # Placeholder, substituted by `make podman-deploy`. Must match the value
        # scroller-customer-interactions-db verifies with, or every credential
        # this app mints is rejected.
        - name: SCROLLER_CUSTOMER_CREDENTIAL_JWT_SECRET
          value: __SCROLLER_CUSTOMER_CREDENTIAL_JWT_SECRET__
        - name: ENRICHMENT_DB_BASE_URL
          value: http://enrichment-db:8200
        - name: ENRICHMENT_DB_API_KEY
          value: a9e08181c6f01244edc35813e387102bd9c889d014d10d27d940d62d7aaf827d
        - name: NEXT_PUBLIC_BASE_PATH
          value: /scroller
      ports:
        - containerPort: 8410
          hostPort: 8410
      readinessProbe:
        httpGet:
          host: pod_scroller_front_end
          path: /scroller/login
          port: 8410
        initialDelaySeconds: 10
        periodSeconds: 10
      livenessProbe:
        httpGet:
          host: pod_scroller_front_end
          path: /scroller/login
          port: 8410
        initialDelaySeconds: 20
        periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: scroller-front-end
spec:
  selector:
    app: pod_scroller_front_end
  ports:
    - name: http
      port: 8410
      targetPort: 8410
  type: LoadBalancer
